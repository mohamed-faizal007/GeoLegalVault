services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object store for local dev and CI (R2 in production).
  # MinIO's images were withdrawn from Docker Hub/quay.io, so this is RustFS
  # (Apache-2.0) — see DECISIONS.md D-034. Pinned by tag AND digest: no :latest.
  storage:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    restart: unless-stopped
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the dev bucket so the backend has somewhere to write
  # (storage.py, Phase 4). Plain AWS CLI instead of MinIO's `mc`; buckets are
  # private by default (Guardrail #4) and nothing here sets an ACL or policy.
  storage-init:
    image: amazon/aws-cli:2.27.0@sha256:e3e329e1d2894b7b4bbb0aacacd0a155262159b2e7a3b4275eb1f24046d3e06c
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      STORAGE_BUCKET: ${STORAGE_BUCKET:-geolegalvault-dev}
    entrypoint: >
      sh -c "
      aws --endpoint-url http://storage:9000 s3api head-bucket --bucket $$STORAGE_BUCKET 2>/dev/null ||
      aws --endpoint-url http://storage:9000 s3api create-bucket --bucket $$STORAGE_BUCKET
      "

  # Still a placeholder (kept only so /health has something at 8545 to
  # probe). The real chain target is Sepolia — see contracts/hardhat.config.ts's
  # "sepolia" network and DEPLOYMENT steps. Phase 5's contracts/ project can
  # run a real local node ad hoc via `cd contracts && npx hardhat node` for
  # dev/testing (that's how tests/integration/test_anchor.py runs), but
  # nothing here depends on this container being a live chain.
  hardhat-node:
    image: node:20-alpine
    command: ["sh", "-c", "echo 'hardhat-node: placeholder — see contracts/ for the real thing' && tail -f /dev/null"]
    ports:
      - "8545:8545"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host-oriented values from .env: inside the compose network,
      # the backend must reach sibling containers by service name, not localhost.
      MONGODB_URI: mongodb://mongo:27017
      STORAGE_ENDPOINT: http://storage:9000
      CHAIN_RPC_URL: http://hardhat-node:8545
    depends_on:
      mongo:
        condition: service_healthy
      storage:
        condition: service_healthy
      hardhat-node:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

  # REL-01 (D-040): the one optional background worker (CLAUDE.md Guardrail #10). It confirms
  # PENDING anchors and re-drives anchors that did not land. OPT-IN: `docker compose up` and CI
  # do not start it. Start it with
  #   docker compose --profile worker up -d anchor-worker
  # CAUTION: it signs and sends real transactions with the SERVICE_WALLET_PRIVATE_KEY in .env,
  # on whatever chain SEPOLIA_RPC_URL points at. Review `python -m app.workers.anchor_confirmer
  # --dry-run` against your database first.
  anchor-worker:
    build: ./backend
    profiles: ["worker"]
    restart: unless-stopped
    command: ["python", "-m", "app.workers.anchor_confirmer"]
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      STORAGE_ENDPOINT: http://storage:9000
      CHAIN_RPC_URL: http://hardhat-node:8545
    depends_on:
      mongo:
        condition: service_healthy
      storage:
        condition: service_healthy
    # The image's own HEALTHCHECK curls the API, which this container does not serve.
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.anchor_confirmer", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    volumes:
      - ./backend/app:/app/app

volumes:
  mongo_data:
  storage_data:
