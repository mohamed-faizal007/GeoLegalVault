services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the dev bucket so the backend has somewhere to write
  # (storage.py, Phase 4).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-geolegalvault-dev}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $$STORAGE_ACCESS_KEY $$STORAGE_SECRET_KEY &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET &&
      mc anonymous set none local/$$STORAGE_BUCKET
      "

  # Still a placeholder (kept only so /health has something at 8545 to
  # probe). The real chain target is Sepolia — see contracts/hardhat.config.ts's
  # "sepolia" network and DEPLOYMENT steps. Phase 5's contracts/ project can
  # run a real local node ad hoc via `cd contracts && npx hardhat node` for
  # dev/testing (that's how tests/integration/test_anchor.py runs), but
  # nothing here depends on this container being a live chain.
  hardhat-node:
    image: node:20-alpine
    command: ["sh", "-c", "echo 'hardhat-node: placeholder — see contracts/ for the real thing' && tail -f /dev/null"]
    ports:
      - "8545:8545"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host-oriented values from .env: inside the compose network,
      # the backend must reach sibling containers by service name, not localhost.
      MONGODB_URI: mongodb://mongo:27017
      STORAGE_ENDPOINT: http://minio:9000
      CHAIN_RPC_URL: http://hardhat-node:8545
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      hardhat-node:
        condition: service_started
    volumes:
      - ./backend/app:/app/app

volumes:
  mongo_data:
  minio_data:
