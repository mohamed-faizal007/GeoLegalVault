[project]
name = "geolegalvault-backend"
version = "0.1.0"
description = "GeoLegalVault backend — FastAPI modular monolith"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session: the app's Motor client is a
# process-lifetime singleton (as it is in production, under uvicorn's one
# loop), so tests must share a single loop too or Motor raises "attached to
# a different loop" the moment a second per-test loop touches it.
asyncio_default_fixture_loop_scope = "session"
